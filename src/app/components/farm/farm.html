<div class="game-wrapper" *ngIf="farmData">

  <div class="bg-layer"></div>

  <div class="ui-top-left">
     <div class="avatar-group">
        <div class="level-star">{{ farmData.level }}</div>
        <div class="mini-exp-bar">
            <div class="mini-exp-fill" [style.width.%]="expProgress"></div>
        </div>
     </div>
     <div class="resource-group">
        <div class="res-tag gold">💰 {{ farmData.gold }}</div>
        <div class="res-tag diamond">💎 0</div> </div>
  </div>

  <div class="main-stage">
    
    <div class="left-panel-beanstalk">
       <div class="beanstalk-body"></div>
    </div>

    <div class="right-panel-floors">
       
       <div class="cloud-floor-row" *ngFor="let floor of cloudFloors">
          <div class="cloud-platform"></div>
          
          <div class="pots-row">
             <div class="pot-wrapper" *ngFor="let slot of floor" (click)="onSlotClick(slot)">
                
                <div *ngIf="slot.plantType" class="remove-btn" (click)="onRemovePlant($event, slot.slotId)">❌</div>
                
                <div class="plant-layer" [class.ready]="slot.displayStatus === 'READY'">
                   <img *ngIf="slot.plantType && slot.currentImage" 
                        [src]="slot.currentImage" 
                        class="plant-img-dynamic">
                   <div *ngIf="slot.displayStatus === 'READY'" class="glow-effect"></div>
                </div>

                <div class="pot-img-layer"></div>

                <div *ngIf="slot.plantType" class="timer-tag" [class.ready-tag]="slot.displayStatus === 'READY'">
                    {{ slot.displayLabel }}
                </div>
             </div>
          </div>
       </div>

    </div>
  </div>

  <div class="shop-trigger-btn" (click)="toggleShop()">
    <div class="shop-icon-img">🏪</div>
    <div class="current-seed-badge" *ngIf="selectedSeed">
        <img [src]="gameConfig.plants[selectedSeed]?.shopIcon">
    </div>
  </div>

  <div class="shop-modal-overlay" *ngIf="isShopOpen" (click)="toggleShop()">
    <div class="shop-modal-content" (click)="$event.stopPropagation()">
      <div class="shop-header">
        <h2>🛍️ Cửa Hàng</h2>
        <button class="close-shop" (click)="toggleShop()">✖</button>
      </div>
      <div class="shop-grid">
        <div *ngFor="let key of plantKeys" class="shop-item" 
             [class.active]="selectedSeed === key"
             [class.locked]="farmData.level < gameConfig.plants[key].unlockLevel"
             (click)="selectSeed(key)">
             <div class="lock-overlay" *ngIf="farmData.level < gameConfig.plants[key].unlockLevel">🔒 Lv.{{ gameConfig.plants[key].unlockLevel }}</div>
             <div class="item-icon"><img [src]="gameConfig.plants[key].shopIcon"></div>
             <div class="item-name">{{ gameConfig.plants[key].displayName }}</div>
             <div class="item-stats">
                 <span class="cost">💰 {{ gameConfig.plants[key].buyPrice }}</span>
                 <span class="time">⏳ {{ gameConfig.plants[key].growTime / 1000 }}s</span>
             </div>
        </div>
      </div>
    </div>
  </div>

</div>
